<div class="login-container">

  <h2>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Username</label>
      <input type="text" formControlName="username" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" formControlName="password" />
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <button type="submit" [disabled]="loginForm.invalid">
      Accedi
    </button>

  </form>

  <button type="button" class="register-btn" (click)="showRegister = !showRegister">
    Registrati
  </button>

</div>

<!-- 🔥 REGISTRAZIONE (SOLO COMPONENTE, NIENTE HTML DUPLICATO) -->
<div *ngIf="showRegister" class="register-wrapper">
  <app-add-user-component></app-add-user-component>
</div>
