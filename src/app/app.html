<header class="site-header">
  <a class="brand" routerLink="/home" aria-label="Vai alla home di NerdMania">
    <img class="brand-logo" ngSrc="/logo-nerdmania.webp" alt="Logo NerdMania" width="190" height="84" priority />

  </a>

  <nav class="main-nav" aria-label="Navigazione principale">

  <a routerLink="/home"
     routerLinkActive="is-active"
     [routerLinkActiveOptions]="{ exact: true }">
     Home
  </a>

  <a routerLink="/catalogo"
     routerLinkActive="is-active">
     Catalogo
  </a>

  <a
    [routerLink]="authService.isLoggedIn() ? '/user' : '/login'">
    Profilo
  </a>

  <!-- SEZIONI SOLO ADMIN -->

  <ng-container *ngIf="authService.isAdmin()">

  <a routerLink="/gestione-utenti"
     routerLinkActive="is-active">
     Gestione utenti
  </a>

  <a routerLink="/admin/prodotti" routerLinkActive="is-active">
    Gestione Prodotti
  </a>

  <a routerLink="/admin/magazzini" routerLinkActive="is-active">
  Gestione Magazzini
</a>

  <a routerLink="/admin/ordini" routerLinkActive="is-active">
    Gestione ordini
  </a>

  <a routerLink="/admin/spedizioni" routerLinkActive="is-active">
    Gestione spedizioni
  </a>

</ng-container>
  <!-- LOGOUT -->

  <ng-container *ngIf="authService.loggedIn$ | async">

    <a
      href="#"
      (click)="logout(); $event.preventDefault()"
      class="nav-link logout-link">

      Logout

    </a>

  </ng-container>

</nav>
</header>

<main class="app-content">
  <router-outlet />
</main>

<footer class="site-footer" aria-label="Informazioni legali">
  <p class="footer-brand">NerdMania Ecommerce</p>
  <p class="footer-copy">© 2026 NerdMania. Tutti i diritti riservati.</p>
</footer>

<a class="floating-cart-btn" routerLink="/carrello" aria-label="Apri il carrello" title="Apri il carrello">
  <svg viewBox="0 0 24 24" class="floating-cart-icon" aria-hidden="true">
    <path d="M3 4h2l2.4 10.2a2 2 0 0 0 2 1.5h7.8a2 2 0 0 0 2-1.6L21 7H7" />
    <circle cx="10" cy="19" r="1.7" />
    <circle cx="17" cy="19" r="1.7" />
  </svg>
  @if (cartItemCount() > 0) {
    <span class="floating-cart-badge">{{ cartItemCount() }}</span>
  }
</a>
